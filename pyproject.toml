[project]
name = "daily-news-agent"
version = "0.4.3"
description = "A stateful, broadcast-only personal news agent for QQ."
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11,<7",
  "google-genai>=1.40,<2",
  "httpx[socks]>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
  "psycopg2-binary>=2.9,<3",
  "websockets>=15,<17",
  "tzdata>=2024.1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
daily-news = "daily_news.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["daily_news*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
